<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <link rel="stylesheet" href="revision.css" />
  </head>

  <body>
    <h1>RESPONSIVE-TABLE</h1>
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Mon</th>
          <th>Tue</th>
          <th>Wed</th>
          <th>Thrus</th>
          <th>Friday</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td data-label="Time">9:00 10:00</td>
          <td data-label="Monday">Economic</td>
          <td data-label="Tuesday">Physics</td>
          <td data-label="Wednesday">Science</td>
          <td data-label="Thursday">Hindi</td>
          <td data-label="Friday">Maths</td>
        </tr>
        <tr>
          <td data-label="Time">10:00 11:00</td>
          <td data-label="Monday">Maths</td>
          <td data-label="Tuesday">Economic</td>
          <td data-label="Wednesday">Physics</td>
          <td data-label="Thursday">Science</td>
          <td data-label="Friday">Hindi</td>
        </tr>
        <tr>
          <td data-label="Time">12:00 1:00</td>
          <td data-label="Monday">Economic</td>
          <td data-label="Tuesday">Physics</td>
          <td data-label="Wednesday">Hindi</td>
          <td data-label="Thursday">Maths</td>
          <td data-label="Friday">Science</td>
        </tr>
        <tr>
          <td data-label="Time">1:00 2:00</td>
          <td data-label="Monday">Economic</td>
          <td data-label="Tuesday">Physics</td>
          <td data-label="Wednesday">Hindi</td>
          <td data-label="Thursday">Maths</td>
          <td data-label="Friday">Science</td>
        </tr>
      </tbody>
    </table>

    <!-- GRID -->
    <h1>RESPONSIVE GRID</h1>
    <div class="container">
      <div class="item1"></div>
      <div class="item2"></div>
      <div class="item3"></div>
      <div class="item4"></div>
      <div class="item5"></div>
    </div>
  </body>
</html>
