<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
<style>/* Define the animation sequence */
@keyframes slidein {
  from {
    transform: translateX(100vw); /* Starts 100% of the viewport width from the left */
    opacity: 0;
  }
  to {
    transform: translateX(0); /* Ends at the default position */
    opacity: 1;
  }
}

/* Apply the animation to the p element */
p {
  animation-name: slidein;
  animation-duration: 3s; /* Animation takes 3 seconds to complete */
  animation-iteration-count: infinite; /* Repeats forever */
  animation-direction: alternate; /* Slides in, then slides out */
  /* Optional properties for styling the paragraph */
  font-size: 20px;
  color: blue;
}
</style>
</head>
<body>

<p>This paragraph is now animated!</p>

</body>
</html>
